<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    .monogram {
      font-family: 'Cormorant Garamond', 'Georgia', 'Times New Roman', serif;
      font-weight: 400;
      fill: #1A1A1A;
      text-anchor: middle;
      dominant-baseline: central;
    }
    @media (prefers-color-scheme: dark) {
      .monogram {
        fill: #FDFAF6;
      }
    }
  </style>
  <text x="36" y="52" font-size="78" class="monogram">B</text>
  <text x="63" y="52" font-size="78" class="monogram">O</text>
</svg>
